<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Registrar asistencia · SAICI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="../styles.css" rel="stylesheet"/>
  <link href="../attendance.css" rel="stylesheet"/>
  <style>
    .attendance-page { width: 100%; max-width: 820px; }
    .attendance-heading { margin-bottom: 20px; }
    .attendance-heading h1 { margin: 0 0 6px; color: #193a22; font-size: 23px; }
    .attendance-heading p { margin: 0; color: #727c73; font-size: 12px; line-height: 1.6; }
    .attendance-notice {
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid #f0e2b8;
      border-radius: 8px;
      background: #fff7df;
      color: #6c571e;
      font-size: 12px;
      line-height: 1.6;
    }
    .attendance-card {
      padding: 22px;
      border: 1px solid #e4eae4;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 8px rgba(18, 59, 34, 0.04);
    }
    .attendance-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px; }
    .attendance-field { display: flex; min-width: 0; flex-direction: column; gap: 7px; }
    .attendance-field label { color: #4d584f; font-size: 12px; font-weight: 600; }
    .attendance-field input,
    .attendance-field select {
      box-sizing: border-box;
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #d7dfd7;
      border-radius: 7px;
      background: white;
      color: #343b35;
      font: inherit;
      font-size: 14px;
    }
    .attendance-field input:focus,
    .attendance-field select:focus { border-color: #27823d; outline: 3px solid rgba(39, 130, 61, 0.16); }
    .attendance-field [aria-invalid="true"] { border-color: #b42318; }
    .attendance-hint { min-height: 16px; color: #707a71; font-size: 11px; line-height: 1.4; }
    .attendance-error { min-height: 16px; color: #a52828; font-size: 12px; line-height: 1.35; }
    .attendance-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .attendance-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 9px 15px;
      border: 1px solid #27823d;
      border-radius: 7px;
      background: #27823d;
      color: white;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .attendance-button.is-secondary { background: white; color: #247238; }
    .attendance-button:focus-visible { outline: 3px solid #77bf91; outline-offset: 3px; }
    .attendance-feedback { margin-top: 18px; }
    .attendance-feedback:empty { display: none; }
    .attendance-feedback.is-error,
    .attendance-feedback.is-success { padding: 12px 14px; border: 1px solid; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .attendance-feedback.is-error { border-color: #efcccc; background: #fff1f1; color: #a52828; }
    .attendance-feedback.is-success { border-color: #c5e4ce; background: #e9f5ee; color: #247238; }
    .screen-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 620px) {
      .attendance-card { padding: 16px; }
      .attendance-form { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .attendance-actions { flex-direction: column; }
      .attendance-button { width: 100%; box-sizing: border-box; }
    }
  </style>
</head>
<body class="attendance-screen">
  <div class="wrap attendance-wrap">
    <div class="app-frame attendance-shell">
      <main class="app-content demo-screen attendance-content">
        <div class="attendance-page">
          <header class="attendance-heading">
            <h1>Registrar asistencia</h1>
            <p>Completa los datos para previsualizar un registro de demostración.</p>
          </header>

          <div class="attendance-notice" role="note">
            Esta pantalla es una demostración: la asistencia no se registra ni se guarda.
          </div>

          <section class="attendance-card" aria-labelledby="attendance-form-title">
            <h2 id="attendance-form-title" class="screen-sr-only">Datos de asistencia</h2>
            <form id="attendance-form" class="attendance-form" novalidate>
              <div class="attendance-field">
                <label for="laboratory">Laboratorio <span aria-hidden="true">*</span></label>
                <select id="laboratory" name="laboratory" required aria-describedby="laboratory-error">
                  <option value="">Selecciona un laboratorio</option>
                  <option value="Laboratorio de Sistemas 1">Laboratorio de Sistemas 1</option>
                  <option value="Laboratorio de Redes">Laboratorio de Redes</option>
                  <option value="Laboratorio de Electrónica">Laboratorio de Electrónica</option>
                </select>
                <span class="attendance-error" id="laboratory-error"></span>
              </div>

              <div class="attendance-field">
                <label for="attendance-date">Fecha <span aria-hidden="true">*</span></label>
                <input id="attendance-date" name="date" type="date" required aria-describedby="date-preview date-error"/>
                <span class="attendance-hint" id="date-preview" aria-live="polite"></span>
                <span class="attendance-error" id="date-error"></span>
              </div>

              <div class="attendance-field">
                <label for="time-in">Hora de entrada <span aria-hidden="true">*</span></label>
                <input id="time-in" name="timeIn" type="time" required aria-describedby="time-in-preview time-in-error"/>
                <span class="attendance-hint" id="time-in-preview" aria-live="polite"></span>
                <span class="attendance-error" id="time-in-error"></span>
              </div>

              <div class="attendance-field">
                <label for="time-out">Hora de salida <span aria-hidden="true">*</span></label>
                <input id="time-out" name="timeOut" type="time" required aria-describedby="time-out-preview time-out-error"/>
                <span class="attendance-hint" id="time-out-preview" aria-live="polite"></span>
                <span class="attendance-error" id="time-out-error"></span>
              </div>
            </form>

            <div class="attendance-actions">
              <button class="attendance-button" type="submit" form="attendance-form">Previsualizar registro</button>
              <a class="attendance-button is-secondary" href="10-historial-asistencia.html">Ver historial</a>
            </div>
            <div id="attendance-feedback" class="attendance-feedback" role="status" aria-live="polite"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="../layout.js"></script>
  <script>
    (function () {
      'use strict';

      var form = document.getElementById('attendance-form');
      var feedback = document.getElementById('attendance-feedback');
      var fields = {
        laboratory: document.getElementById('laboratory'),
        date: document.getElementById('attendance-date'),
        timeIn: document.getElementById('time-in'),
        timeOut: document.getElementById('time-out')
      };
      var today = new Date();
      var localToday = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, '0'),
        String(today.getDate()).padStart(2, '0')
      ].join('-');
      fields.date.max = localToday;

      function setError(field, message) {
        var errorId = field.name === 'date' ? 'date-error' : field.id + '-error';
        var error = document.getElementById(errorId);
        field.setAttribute('aria-invalid', message ? 'true' : 'false');
        error.textContent = message;
      }

      function clearFeedback() {
        feedback.className = 'attendance-feedback';
        feedback.textContent = '';
      }

      function updatePreview(field) {
        var preview;
        if (field === fields.date) {
          preview = document.getElementById('date-preview');
          if (!field.value) {
            preview.textContent = 'La fecha se mostrará escrita en español.';
            return;
          }
          var parts = field.value.split('-');
          var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          preview.textContent = 'Fecha seleccionada: ' + new Intl.DateTimeFormat('es-CO', {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
          }).format(date) + '.';
          return;
        }

        preview = document.getElementById(field === fields.timeIn ? 'time-in-preview' : 'time-out-preview');
        preview.textContent = field.value
          ? 'Hora para la confirmación (24 h): ' + field.value + '.'
          : 'La confirmación mostrará la hora en formato de 24 horas.';
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearFeedback();

        var errors = [];
        Object.keys(fields).forEach(function (key) {
          var field = fields[key];
          var error = field.value ? '' : 'Este campo es obligatorio.';
          if (key === 'date' && field.value && field.value > localToday) {
            error = 'La fecha no puede ser posterior a hoy.';
          }
          setError(field, error);
          if (error) errors.push(field);
        });

        if (!fields.timeIn.value || !fields.timeOut.value) {
          if (!fields.timeIn.value) setError(fields.timeIn, 'Indica la hora de entrada.');
          if (!fields.timeOut.value) setError(fields.timeOut, 'Indica la hora de salida.');
        } else if (fields.timeOut.value <= fields.timeIn.value) {
          setError(fields.timeOut, 'La salida debe ser posterior a la entrada.');
          errors.push(fields.timeOut);
        }

        if (errors.length) {
          feedback.className = 'attendance-feedback is-error';
          feedback.textContent = 'Revisa los campos señalados antes de continuar.';
          errors[0].focus();
          return;
        }

        var startMinutes = fields.timeIn.value.split(':').reduce(function (total, part) {
          return total * 60 + Number(part);
        }, 0);
        var endMinutes = fields.timeOut.value.split(':').reduce(function (total, part) {
          return total * 60 + Number(part);
        }, 0);
        var dateParts = fields.date.value.split('-');
        var attendanceDate = new Date(Number(dateParts[0]), Number(dateParts[1]) - 1, Number(dateParts[2]));
        var formattedDate = new Intl.DateTimeFormat('es-CO', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }).format(attendanceDate);
        var durationMinutes = endMinutes - startMinutes;
        var hours = Math.floor(durationMinutes / 60);
        var minutes = durationMinutes % 60;
        var duration = hours ? hours + ' h' : '';
        if (minutes) duration += (duration ? ' ' : '') + minutes + ' min';

        feedback.className = 'attendance-feedback is-success';
        feedback.textContent = 'Demostración confirmada: ' + fields.laboratory.value + ', ' +
          formattedDate + ', de ' + fields.timeIn.value + ' a ' + fields.timeOut.value +
          ' (' + duration + '). No se registró ni guardó la asistencia.';
      });

      Object.keys(fields).forEach(function (key) {
        fields[key].addEventListener('input', function () {
          setError(fields[key], '');
          updatePreview(fields[key]);
          clearFeedback();
        });
      });

      updatePreview(fields.date);
      updatePreview(fields.timeIn);
      updatePreview(fields.timeOut);
    }());
  </script>
</body>
</html>
